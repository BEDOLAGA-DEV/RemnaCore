name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  ci:
    name: Dagger Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | sudo env BIN_DIR=/usr/local/bin sh

      - name: Run pipeline (lint + test + build)
        run: dagger run go run ./ci/

  sqlc:
    name: sqlc gen up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # sqlc is unavailable in the dev env, so hand-edits to queries/*.sql or a
      # schema-affecting migration can silently diverge from the committed
      # gen/*.sql.go. Regenerate and fail if the tree changed. Pinned to the
      # version that generated the committed code (see the header comment in
      # gen/*.sql.go) so a version bump doesn't read as false drift.
      - name: Regenerate and check for drift
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code internal/adapter/postgres/gen || {
            echo "::error::sqlc generated code is out of date — run 'make gen' and commit internal/adapter/postgres/gen"; exit 1; }

  integration:
    name: Integration (real Postgres + RLS + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Migrations must apply cleanly on an EMPTY database, and be idempotent on
      # a second run — this is what a fresh `first-deploy.sh` does. It would have
      # caught the partitioned-unique-index migration failure.
      - name: Migrations apply on clean DB (twice = idempotent)
        run: |
          docker run -d --name migdb -e POSTGRES_USER=platform -e POSTGRES_PASSWORD=secret \
            -e POSTGRES_DB=remnacore -p 5433:5432 postgres:18
          # pg_isready is not enough: the postgres entrypoint runs a TEMPORARY
          # server on the unix socket during init that accepts connections before
          # POSTGRES_DB exists, so pg_isready can return "accepting connections"
          # while a real query still fails with 'database "remnacore" does not
          # exist'. Poll an actual SELECT against the target DB instead.
          for i in $(seq 1 30); do
            docker exec migdb psql -U platform -d remnacore -tAc 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec migdb psql -U platform -d remnacore -tAc 'SELECT 1' >/dev/null
          PSQL="docker exec -i migdb psql -U platform -d remnacore -v ON_ERROR_STOP=1" \
            MIGRATIONS_DIR="internal/adapter/postgres/migrations" bash scripts/migrate.sh
          echo "--- re-running migrations to prove idempotency ---"
          PSQL="docker exec -i migdb psql -U platform -d remnacore -v ON_ERROR_STOP=1" \
            MIGRATIONS_DIR="internal/adapter/postgres/migrations" bash scripts/migrate.sh
          docker rm -f migdb

      # The real-DB / RLS / tenant-isolation suite. testcontainers uses the
      # runner's Docker. REMNACORE_REQUIRE_INTEGRATION turns "Docker unavailable"
      # from a silent skip into a hard failure so this job can't go green vacuously.
      # BLOCKING: every harness applies the full migration chain (allMigrationScripts)
      # and RLS tests run under the NON-superuser rls_app role, so this is a real gate.
      #
      # TestExplain* are excluded: they assert query-planner choices (index vs seq
      # scan), which are inherently data-size/stats-dependent and flaky on CI's
      # tiny datasets — a performance check, not a correctness gate.
      - name: Integration tests (-tags=integration)
        env:
          REMNACORE_REQUIRE_INTEGRATION: "1"
        run: go test -tags=integration -count=1 -skip 'TestExplain' ./internal/adapter/postgres/... ./tests/integration/...
